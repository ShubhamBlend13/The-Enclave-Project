name: Push Supabase migrations

on:
  push:
    branches:
      - prototype/core-app
    paths:
      - "supabase/migrations/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-migrations:
    name: Push database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: viiznajcezutpecckkne

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase CLI
        run: npx supabase --version

      - name: Link Supabase project
        run: >
          npx supabase link
          --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: npx supabase db push --dry-run

      - name: Push pending migrations
        run: npx supabase db push

      - name: Verify migration history
        run: npx supabase migration list